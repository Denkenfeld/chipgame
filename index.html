<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Parallelogram Packer - Pro Edition & Minesweeper</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
            --glass: rgba(0, 15, 30, 0.9);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; display: flex;
            flex-direction: row;
        }
        #ui-panel {
            width: 22%; min-width: 300px;
            height: 100vh;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-right: 3px solid var(--neon-cyan);
            z-index: 200; padding: 30px;
            box-sizing: border-box; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 15px 0 30px rgba(0, 242, 255, 0.1);
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            height: 100vh;
        }
        @media (max-aspect-ratio: 1/1), (max-width: 768px) {
            body, html { flex-direction: column; }
            #canvas-container { height: 50vh; width: 100vw; order: 1; }
            #ui-panel { height: 50vh; width: 100vw; min-width: unset; order: 2; border-right: none; border-top: 3px solid var(--neon-cyan); }
            #zoom-controls { bottom: calc(50vh + 20px) !important; right: 20px !important; }
            #game-ui { top: 10px !important; right: 10px !important; }
        }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; text-shadow: 0 0 10px var(--neon-cyan); margin: 0; }
        .control-group { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid rgba(0, 242, 255, 0.15); padding-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 15px; }
        .switch-row { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--neon-cyan); }
        label { font-size: 0.85rem; text-transform: uppercase; color: var(--neon-magenta); font-weight: bold; flex: 1; }
       
        input[type=number] {
            width: 80px; background: rgba(0,0,0,0.7); border: 1px solid var(--neon-cyan);
            color: white; font-family: 'Orbitron'; font-size: 0.8rem; padding: 5px;
        }
        input[type=range] { flex: 2; cursor: pointer; accent-color: var(--neon-cyan); }
        input[type=checkbox] { cursor: pointer; width: 18px; height: 18px; }
        #export-btn {
            background: transparent; border: 1px solid var(--neon-magenta);
            color: var(--neon-magenta); padding: 10px; font-family: 'Orbitron';
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
            font-size: 0.7rem; margin-top: 10px;
        }
        #export-btn:hover { background: var(--neon-magenta); color: white; box-shadow: 0 0 15px var(--neon-magenta); }
        canvas { display: block; width: 100%; height: 100%; }
        #count-display { font-family: 'Orbitron'; font-size: 1.8rem; color: var(--neon-cyan); }
        #zoom-controls {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 10px; z-index: 300;
        }
        .zoom-btn {
            width: 50px; height: 50px; background: var(--glass);
            border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            font-family: 'Orbitron'; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }
        .zoom-btn:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 20px var(--neon-cyan); }
        /* GAME UI */
        #game-ui {
            position: absolute; top: 20px; right: 30px; z-index: 300;
            display: flex; gap: 10px; align-items: center;
        }
        #play-btn {
            background: var(--bg-dark); border: 2px solid #00ff00;
            color: #00ff00; padding: 10px 20px; font-family: 'Orbitron';
            font-size: 1rem; cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }
        #play-btn:hover { background: #00ff00; color: black; box-shadow: 0 0 20px #00ff00; }
        #play-btn.active { border-color: red; color: red; box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        #play-btn.active:hover { background: red; color: white; }
       
        #game-status {
            font-family: 'Orbitron'; color: white; background: rgba(0,0,0,0.8);
            padding: 10px; border: 1px solid white; display: none;
        }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h1>CYBER PACKER PRO</h1>
       
        <div class="control-group">
            <label>Durchmesser</label>
            <div class="row">
                <input type="range" id="radius-slider" min="200" max="1200" value="600">
                <input type="number" id="radius-num" value="600">
            </div>
        </div>
        <div class="control-group">
            <label>Winkel Alpha (°)</label>
            <div class="row">
                <input type="range" id="alpha-slider" min="0.1" max="179.9" step="0.1" value="60">
                <input type="number" id="alpha-num" value="60" step="0.1">
            </div>
        </div>
        <div class="control-group">
            <label>Breite (w) / Höhe (h)</label>
            <div class="row">
                <input type="number" id="width-num" value="60">
                <input type="range" id="width-slider" min="5" max="300" value="60">
            </div>
            <div class="row">
                <input type="number" id="height-num" value="50">
                <input type="range" id="height-slider" min="5" max="300" value="50">
            </div>
        </div>
        <div class="control-group">
            <label>Scribe Line / Gap (mm)</label>
            <div class="row">
                <label style="font-size: 0.65rem; color: var(--neon-cyan);">Gap X</label>
                <input type="range" id="gapX-slider" min="0" max="50" step="0.5" value="2">
                <input type="number" id="gapX-num" value="2" step="0.5">
            </div>
            <div class="row">
                <label style="font-size: 0.65rem; color: var(--neon-cyan);">Gap Y</label>
                <input type="range" id="gapY-slider" min="0" max="50" step="0.5" value="2">
                <input type="number" id="gapY-num" value="2" step="0.5">
            </div>
        </div>
        <div class="control-group">
            <label>Grid Alignment (Offset mm)</label>
            <div class="row">
                <label style="font-size: 0.7rem; color: var(--neon-cyan);">X</label>
                <input type="range" id="offsetX-slider" min="-100" max="100" value="0">
                <input type="number" id="offsetX-num" value="0">
            </div>
            <div class="row">
                <label style="font-size: 0.7rem; color: var(--neon-cyan);">Y</label>
                <input type="range" id="offsetY-slider" min="-100" max="100" value="0">
                <input type="number" id="offsetY-num" value="0">
            </div>
        </div>
        <div class="control-group">
            <label>Innenabstand (Padding)</label>
            <div class="row">
                <input type="range" id="pad-slider" min="0" max="150" value="10">
                <input type="number" id="pad-num" value="10">
            </div>
            <div class="switch-row">
                <input type="checkbox" id="show-padding-circle" checked> <span>Padding-Kreis anzeigen</span>
            </div>
        </div>
        <div class="control-group">
            <label>Qualitäts-Ratio (0% Rot / 100% Grün)</label>
            <div class="row">
                <input type="range" id="ratio-slider" min="0" max="100" value="50">
                <input type="number" id="ratio-num" value="50">
            </div>
            <div class="switch-row">
                <input type="checkbox" id="show-eval-color" checked> <span>Qualitäts-Farben einblenden</span>
            </div>
            <div class="switch-row">
                <input type="checkbox" id="show-partial" checked> <span>Partial Dies (grau) anzeigen</span>
            </div>
        </div>
        <div class="control-group">
            <label>Adressen-Anzeige</label>
            <div class="switch-row">
                <input type="checkbox" id="show-labels" checked> <span>Labels im Grid dauerhaft zeigen</span>
            </div>
        </div>
        <div class="control-group">
            <label>Farben (Design)</label>
            <label style="font-size: 0.7rem;">Ring Farbe</label>
            <input type="range" id="color-circle" min="0" max="360" value="180">
            <label style="font-size: 0.7rem;">BG Lum</label>
            <input type="range" id="color-bg" min="0" max="25" value="5">
        </div>
        <button id="export-btn">PDF Exportieren</button>
        <div id="stats">
            <div style="font-size: 0.8rem; opacity: 0.7;">TOTAL PACKED (NET):</div>
            <div id="count-display">000</div>
        </div>
    </div>
    <div id="canvas-container">
        <div id="game-ui">
            <div id="game-status">MINES: 00</div>
            <button id="play-btn" onclick="toggleGame()">PLAY WAFER-SWEEPER</button>
        </div>
        <canvas id="mainCanvas"></canvas>
    </div>
    <div id="zoom-controls">
        <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
        <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
    </div>
    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       
        function resumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playSound(type) {
            resumeAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'boom') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }
        let cfg = {
            radius: 300, alpha: 60, pWidth: 60, pHeight: 50, padding: 10,
            gapX: 2, gapY: 2, offsetX: 0, offsetY: 0,
            hueShape: 280, hueCircle: 180, bgLum: 5,
            ratio: 50, showEval: true, showLabels: true,
            showPartial: true, showPaddingCircle: true,
            zoom: 1.0
        };
       
        let mousePos = { x: 0, y: 0 };
        let hoveredAddr = null;
        let selectedAddr = null;
        let activeChipsList = []; // Liste für Packer
       
        // --- GAME VARIABLES ---
        let isGameMode = false;
        let gameData = {}; // Key: "Cx-Rx", Value: { isMine, revealed, flagged, neighbors }
        let gameOver = false;
        let gameWin = false;
        let mineCount = 0;

        // --- KORRIGIERTE NACHBARSCHAFTS-LOGIK (deine neue Version) ---
        function getNeighbors(c, r) {
            // Da wir ein verschobenes Grid haben, sind die Nachbarn
            // die 8 umliegenden Koordinaten im C/R-System.
            return [
                `C${c-1}-R${r-1}`, `C${c}-R${r-1}`, `C${c+1}-R${r-1}`,
                `C${c-1}-R${r}`, `C${c+1}-R${r}`,
                `C${c-1}-R${r+1}`, `C${c}-R${r+1}`, `C${c+1}-R${r+1}`
            ];
        }

        function initGame() {
            gameData = {};
            gameOver = false;
            gameWin = false;
           
            // 1. Erst alle gültigen Chips (inside) in das Game-Objekt laden
            activeChipsList.forEach(chip => {
                const parts = chip.id.split('-R');
                const c = parseInt(parts[0].substring(1));
                const r = parseInt(parts[1]);
               
                gameData[chip.id] = {
                    id: chip.id,
                    c: c,
                    r: r,
                    isMine: false,
                    revealed: false,
                    flagged: false,
                    neighbors: 0
                };
            });
            const chips = Object.keys(gameData);
            const totalMines = Math.floor(chips.length * 0.15);
            mineCount = totalMines;
            document.getElementById('game-status').innerText = "MINES: " + mineCount;
            // 2. Minen zufällig verteilen
            let minesPlaced = 0;
            while(minesPlaced < totalMines) {
                const rndId = chips[Math.floor(Math.random() * chips.length)];
                if(!gameData[rndId].isMine) {
                    gameData[rndId].isMine = true;
                    minesPlaced++;
                }
            }
            // 3. Nachbarn berechnen (Nur Chips zählen, die im gameData existieren UND Minen sind)
            chips.forEach(id => {
                if(gameData[id].isMine) return;
                const potentialNeighbors = getNeighbors(gameData[id].c, gameData[id].r);
                let count = 0;
                potentialNeighbors.forEach(nId => {
                    if(gameData[nId] && gameData[nId].isMine) {
                        count++;
                    }
                });
                gameData[id].neighbors = count;
            });
        }

        function sync(id, key) {
            const slider = document.getElementById(id + '-slider');
            const num = document.getElementById(id + '-num');
            const update = (val) => {
                cfg[key] = parseFloat(val) / (key === 'radius' ? 2 : 1);
                slider.value = val; num.value = val;
            };
            if(slider) slider.oninput = (e) => update(e.target.value);
            if(num) num.onchange = (e) => update(e.target.value);
            update(slider ? slider.value : num.value);
        }
        function adjustZoom(delta) { cfg.zoom = Math.max(0.1, Math.min(5, cfg.zoom + delta)); }
        ['radius', 'alpha', 'pWidth', 'pHeight', 'padding', 'gapX', 'gapY', 'offsetX', 'offsetY', 'ratio'].forEach(k => {
            const id = k === 'pWidth' ? 'width' : k === 'pHeight' ? 'height' : k === 'padding' ? 'pad' : k;
            sync(id, k);
        });
        document.getElementById('color-circle').oninput = (e) => cfg.hueCircle = e.target.value;
        document.getElementById('color-bg').oninput = (e) => cfg.bgLum = e.target.value;
        document.getElementById('show-eval-color').onchange = (e) => cfg.showEval = e.target.checked;
        document.getElementById('show-labels').onchange = (e) => cfg.showLabels = e.target.checked;
        document.getElementById('show-partial').onchange = (e) => cfg.showPartial = e.target.checked;
        document.getElementById('show-padding-circle').onchange = (e) => cfg.showPaddingCircle = e.target.checked;

        function updateMousePos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const cx = canvas.width / 2 - (canvas.width * 0.1);
            const cy = canvas.height / 2;
            mousePos.x = (clientX - rect.left - cx) / cfg.zoom + cx;
            mousePos.y = (clientY - rect.top - cy) / cfg.zoom + cy;
        }
        canvas.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
       
        // GAME & SELECTION CLICK HANDLER
        canvas.addEventListener('mousedown', (e) => {
            resumeAudio(); // Ensure audio context is ready
            if (e.button === 0) { // Links
                if (!isGameMode) {
                    if (hoveredAddr) selectedAddr = hoveredAddr;
                    else selectedAddr = null;
                } else {
                    if (hoveredAddr && !gameOver && !gameWin) {
                        revealTile(hoveredAddr, false);
                    }
                }
            } else if (e.button === 2 && isGameMode) { // Rechts
                 if (hoveredAddr && !gameOver && !gameWin) {
                    toggleFlag(hoveredAddr);
                }
            }
        });
        canvas.addEventListener('contextmenu', (e) => {
            if(isGameMode) e.preventDefault();
        });

        function toggleGame() {
            isGameMode = !isGameMode;
            const btn = document.getElementById('play-btn');
            const status = document.getElementById('game-status');
           
            if (isGameMode) {
                btn.innerText = "STOP GAME";
                btn.classList.add("active");
                status.style.display = "block";
                initGame();
            } else {
                btn.innerText = "PLAY WAFER-SWEEPER";
                btn.classList.remove("active");
                status.style.display = "none";
                gameOver = false;
                gameWin = false;
            }
        }

        // Updated Reveal Logic with Audio and Flood Fill
        function revealTile(id, isRecursive = false) {
            const tile = gameData[id];
            if(!tile || tile.revealed || tile.flagged) return;
            tile.revealed = true;
            if (tile.isMine) {
                playSound('boom');
                gameOver = true;
                document.getElementById('game-status').innerText = "GAME OVER!";
                document.getElementById('game-status').style.color = "red";
                revealAll();
            } else {
                if(!isRecursive) playSound('click');
                if (tile.neighbors === 0) {
                    const neighbors = getNeighbors(tile.c, tile.r);
                    neighbors.forEach(nId => {
                        revealTile(nId, true);
                    });
                }
                checkWin();
            }
        }
        function toggleFlag(id) {
            const tile = gameData[id];
            if (!tile || tile.revealed) return;
            tile.flagged = !tile.flagged;
            playSound('click');
        }
        function revealAll() {
            Object.values(gameData).forEach(t => t.revealed = true);
        }
        function checkWin() {
            const tiles = Object.values(gameData);
            const revealedCount = tiles.filter(t => t.revealed).length;
            const mineCount = tiles.filter(t => t.isMine).length;
            if (revealedCount + mineCount === tiles.length) {
                gameWin = true;
                document.getElementById('game-status').innerText = "YOU WIN!";
                document.getElementById('game-status').style.color = "#00ff00";
            }
        }

        // --- EXPORT & HELPER ---
        document.getElementById('export-btn').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18);
            doc.text("CYBER PACKER PRO - REPORT", 14, 20);
            const projectData = [
                ["Parameter", "Wert"],
                ["Wafer Durchmesser", (cfg.radius * 2) + " mm"],
                ["Chip Breite (w)", cfg.pWidth + " mm"],
                ["Chip Hoehe (h)", cfg.pHeight + " mm"],
                ["Net Chips (Total)", activeChipsList.length.toString()]
            ];
            doc.autoTable({ startY: 35, head: [projectData[0]], body: projectData.slice(1), theme: 'grid' });
            const imgData = canvas.toDataURL('image/png');
            doc.addPage();
            doc.addImage(imgData, 'PNG', 10, 30, 190, 120);
            doc.addPage();
            doc.text("CHIP LISTE", 14, 20);
            const tableRows = activeChipsList.map(chip => [chip.id, chip.status, chip.posX.toFixed(2), chip.posY.toFixed(2)]);
            doc.autoTable({ startY: 30, head: [['Chip ID', 'Status', 'X Pos', 'Y Pos']], body: tableRows });
            doc.save(`CyberPacker_Report.pdf`);
        });

        function seededRandom(c, r) {
            const x = Math.sin(c * 12.9898 + r * 78.233) * 43758.5453;
            return x - Math.floor(x);
        }
        function getParallelogram(x, y, w, h, alphaDeg) {
            const alpha = (alphaDeg * Math.PI) / 180;
            const shift = h / Math.tan(alpha);
            return [{x, y}, {x: x+w, y}, {x: x+w+shift, y: y+h}, {x: x+shift, y: y+h}];
        }
        function isPointInPoly(p, verts) {
            let isInside = false;
            for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
                if (((verts[i].y > p.y) !== (verts[j].y > p.y)) &&
                    (p.x < (verts[j].x - verts[i].x) * (p.y - verts[i].y) / (verts[j].y - verts[i].y) + verts[i].x)) {
                    isInside = !isInside;
                }
            }
            return isInside;
        }

        // --- DRAW LOOP ---
        function draw() {
            const screenW = canvas.width = canvas.parentElement.clientWidth;
            const screenH = canvas.height = canvas.parentElement.clientHeight;
            const cx = screenW / 2 - (screenW * 0.1);
            const cy = screenH / 2;
            ctx.fillStyle = `hsl(240, 30%, ${cfg.bgLum}%)`;
            ctx.fillRect(0, 0, screenW, screenH);
            ctx.save();
            ctx.translate(cx, cy); ctx.scale(cfg.zoom, cfg.zoom); ctx.translate(-cx, -cy);
            // Wafer Ring
            ctx.strokeStyle = `hsl(${cfg.hueCircle}, 100%, 50%)`;
            ctx.lineWidth = 4 / cfg.zoom;
            ctx.beginPath(); ctx.arc(cx, cy, cfg.radius, 0, Math.PI*2); ctx.stroke();
            if (cfg.showPaddingCircle) {
                ctx.save(); ctx.setLineDash([5, 5]);
                ctx.strokeStyle = "rgba(0, 242, 255, 0.4)"; ctx.lineWidth = 2 / cfg.zoom;
                ctx.beginPath(); ctx.arc(cx, cy, cfg.radius - cfg.padding, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
            }
            const shiftX = cfg.pHeight / Math.tan((cfg.alpha * Math.PI) / 180);
            const stepX = cfg.pWidth + cfg.gapX;
            const stepY = cfg.pHeight + cfg.gapY;
           
            let count = 0;
            let currentHover = null;
            let tempChipsList = [];
            const range = Math.ceil(cfg.radius * 2 / Math.min(cfg.pHeight, cfg.pWidth)) + 15;
           
            for (let rIdx = -range; rIdx < range; rIdx++) {
                for (let cIdx = -range; cIdx < range; cIdx++) {
                    const x = cx + cIdx * stepX + rIdx * shiftX - cfg.pWidth/2 + cfg.offsetX;
                    const y = cy + rIdx * stepY - cfg.pHeight/2 + cfg.offsetY;
                    const verts = getParallelogram(x, y, cfg.pWidth, cfg.pHeight, cfg.alpha);
                    const limit = cfg.radius - cfg.padding;
                    let inside = true;
                    let touchesCircle = false;
                    for (let v of verts) {
                        const dist = Math.sqrt((v.x-cx)**2 + (v.y-cy)**2);
                        if (dist > limit) inside = false;
                        if (dist > cfg.radius) touchesCircle = true;
                    }
                    if (inside || (cfg.showPartial && !touchesCircle)) {
                        const addr = `C${cIdx}-R${rIdx}`;
                        const isThisHovered = isPointInPoly(mousePos, verts);
                        const isThisSelected = selectedAddr === addr;
                        if (isThisHovered) currentHover = addr;
                       
                        // Packer Data
                        const rnd = seededRandom(cIdx, rIdx);
                        const isGood = rnd < (cfg.ratio / 100);
                        if (inside) {
                            count++;
                            tempChipsList.push({ id: addr, status: isGood ? 'GOOD' : 'BAD', posX: x - cx, posY: y - cy });
                        }
                        // --- DRAW LOGIC: SWITCH BETWEEN PACKER & GAME ---
                        let fillStyle = "transparent";
                        let strokeStyle = `hsl(280, 100%, 50%)`;
                        let textToDraw = null;
                        let textColor = "white";
                        if (!inside) {
                            strokeStyle = "rgba(100, 100, 100, 0.5)";
                            fillStyle = "rgba(100, 100, 100, 0.1)";
                        } else if (isGameMode) {
                            const tile = gameData[addr];
                            if (tile) {
                                if (tile.revealed) {
                                    if (tile.isMine) {
                                        fillStyle = "#ff0000";
                                        textToDraw = "X";
                                    } else {
                                        fillStyle = "rgba(0,0,0,0.5)";
                                        strokeStyle = "#444";
                                        if (tile.neighbors > 0) {
                                            textToDraw = tile.neighbors.toString();
                                            const colors = ['#00f', '#0f0', '#f00', '#009', '#900', '#099', '#909', '#aaa'];
                                            textColor = colors[tile.neighbors-1] || 'white';
                                        }
                                    }
                                } else {
                                    fillStyle = isThisHovered ? "#333" : "#1a1a1a";
                                    strokeStyle = "#00f2ff";
                                    if (tile.flagged) {
                                        fillStyle = "rgba(255, 0, 255, 0.5)";
                                        textToDraw = "F";
                                        textColor = "#ff00ff";
                                    }
                                }
                            } else {
                                fillStyle = "#333";
                            }
                        } else {
                            if (cfg.showEval) {
                                strokeStyle = isGood ? "#00ff00" : "#ff0000";
                                fillStyle = isGood ? "rgba(0,255,0,0.15)" : "rgba(255,0,0,0.15)";
                            }
                            if (cfg.showLabels) textToDraw = addr;
                        }
                        if (isThisHovered || isThisSelected) {
                            ctx.lineWidth = 3/cfg.zoom; ctx.shadowBlur = 10; ctx.shadowColor = strokeStyle;
                        } else {
                            ctx.lineWidth = 1/cfg.zoom; ctx.shadowBlur = 0;
                        }
                        ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y);
                        verts.forEach(v => ctx.lineTo(v.x, v.y)); ctx.closePath();
                        if (inside || cfg.showEval) ctx.fill();
                        ctx.fillStyle = fillStyle; ctx.fill();
                        ctx.strokeStyle = strokeStyle; ctx.stroke();
                        ctx.shadowBlur = 0;
                        if (textToDraw && inside) {
                            ctx.fillStyle = isGameMode ? textColor : "rgba(255,255,255,0.6)";
                            const fontSize = isGameMode ? 20 : 8;
                            const fontW = isGameMode ? "bold" : "normal";
                            ctx.font = `${fontW} ${fontSize/cfg.zoom}px Orbitron`;
                            ctx.textAlign = "center";
                            ctx.fillText(textToDraw, x + cfg.pWidth/2 + shiftX/2, y + cfg.pHeight/2 + (fontSize/3/cfg.zoom));
                        }
                    }
                }
            }
            hoveredAddr = currentHover; activeChipsList = tempChipsList;
           
            // Header Info Draw
            if (selectedAddr || hoveredAddr) {
                const displayTarget = selectedAddr || hoveredAddr;
                const headerY = cy - cfg.radius - 40;
                ctx.font = `bold ${20/cfg.zoom}px Orbitron`; ctx.textAlign = "center";
                ctx.fillStyle = "#00f2ff";
               
                let infoText = "";
                if (!isGameMode) {
                    const targetChip = activeChipsList.find(c => c.id === displayTarget);
                    const statusText = targetChip ? targetChip.status : "";
                    const statusColor = statusText === 'GOOD' ? "#00ff00" : "#ff0000";
                    ctx.fillText(`ADDR: ${displayTarget}`, cx - 40, headerY);
                    ctx.fillStyle = statusColor;
                    ctx.textAlign = "left";
                    ctx.fillText(` [${statusText}]`, cx + 30, headerY);
                } else {
                    const t = gameData[displayTarget];
                    if(t && t.revealed) infoText = t.isMine ? " [MINE]" : ` [N:${t.neighbors}]`;
                    else if(t && t.flagged) infoText = " [FLAGGED]";
                    else infoText = " [HIDDEN]";
                    ctx.fillText(`ADDR: ${displayTarget}${infoText}`, cx, headerY);
                }
            }
           
            ctx.restore();
            document.getElementById('count-display').innerText = count.toString().padStart(3, '0');
            requestAnimationFrame(draw);
        }
        window.onresize = () => draw();
        draw();
    </script>
</body>
</html>
